<h2>Binary Topography — Wind Source</h2>
<p class="subtitle">Your cursor is the origin — contour flow radiates outward from wherever you place it.</p>

<div style="display: flex; justify-content: center; margin-top: 24px;">
  <div style="border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08);">
    <canvas id="topo" width="900" height="500" style="display: block; cursor: crosshair;"></canvas>
  </div>
</div>

<p style="text-align: center; margin-top: 16px; font-size: 13px; opacity: 0.5;">Place your cursor anywhere — the field flows outward from that point</p>

<script>
(function() {
  const c = document.getElementById('topo');
  const ctx = c.getContext('2d');
  const cols = 100, rows = 55;
  const cw = c.width / cols, ch = c.height / rows;

  // Mouse position (normalized 0-1), defaults to center
  let mouseX = 0.5, mouseY = 0.5;
  let smoothMX = 0.5, smoothMY = 0.5;
  let mouseActive = false;

  c.addEventListener('mousemove', (e) => {
    const rect = c.getBoundingClientRect();
    mouseX = (e.clientX - rect.left) / rect.width;
    mouseY = (e.clientY - rect.top) / rect.height;
    mouseActive = true;
  });

  c.addEventListener('mouseleave', () => {
    mouseActive = false;
  });

  let frame = 0;

  function draw() {
    ctx.fillStyle = '#09090b';
    ctx.fillRect(0, 0, c.width, c.height);

    // Smooth mouse tracking — lazy follow
    smoothMX += (mouseX - smoothMX) * 0.03;
    smoothMY += (mouseY - smoothMY) * 0.03;

    const fontSize = Math.min(cw, ch) * 0.72;
    ctx.font = `${fontSize}px "SF Mono", "Fira Code", "Cascadia Code", monospace`;
    ctx.textBaseline = 'middle';

    const t = frame * 0.003;

    for (let r = 0; r < rows; r++) {
      for (let col = 0; col < cols; col++) {
        const x = col / cols;
        const y = r / rows;

        // Vector from mouse to this point
        const dx = x - smoothMX;
        const dy = y - smoothMY;
        const dist = Math.sqrt(dx * dx + dy * dy);

        // The key idea: each point's phase is offset by its distance
        // from the mouse. This makes waves radiate outward from the cursor.
        // Points further from cursor are "further along" in the wave,
        // creating the illusion of flow moving away from the mouse.
        const radialPhase = dist * 8.0;

        // Base topographic field — but phase-shifted radially from cursor
        let v = Math.sin(x * 5.0 + t * 1.2 + radialPhase * 0.3)
                  * Math.cos(y * 3.5 - t * 0.8 + radialPhase * 0.2) * 0.5
              + Math.sin((x + y) * 4.0 + t * 0.6 + radialPhase * 0.25) * 0.4
              + Math.sin(x * 10 + y * 6 + t * 1.5) * 0.15
              + Math.cos(x * 7 - y * 9 + t * 0.4) * 0.2;

        const normalized = (v + 2.0) / 4.0;

        // Contour detection
        const contourSpacing = 0.09;
        const modVal = normalized % contourSpacing;
        const distToLine = Math.abs(modVal - contourSpacing / 2);
        const isContour = distToLine < 0.012;
        const isNearContour = distToLine < 0.025;
        const isPeak = normalized > 0.72;

        if (isContour || isPeak) {
          const char = normalized > 0.5 ? '1' : '0';

          let hue, sat, light, alpha;

          if (isPeak && !isContour) {
            hue = 170 + normalized * 30;
            sat = 50;
            light = 25 + normalized * 20;
            alpha = normalized * 0.5;
          } else {
            hue = 165 + normalized * 50;
            sat = 55 + normalized * 25;
            light = 35 + normalized * 35;
            alpha = isContour ? (0.6 + normalized * 0.35) : 0.3;
          }

          ctx.fillStyle = `hsla(${hue}, ${sat}%, ${light}%, ${alpha})`;
          ctx.fillText(char, col * cw + cw * 0.15, r * ch + ch * 0.55);
        } else if (isNearContour) {
          const char = normalized > 0.5 ? '1' : '0';
          ctx.fillStyle = `hsla(180, 30%, 25%, 0.12)`;
          ctx.fillText(char, col * cw + cw * 0.15, r * ch + ch * 0.55);
        }
      }
    }

    frame++;
    requestAnimationFrame(draw);
  }

  draw();
})();
</script>

<h2>Binary Topography — Subtle Flow</h2>
<p class="subtitle">Mouse gently steers the drift direction rather than disrupting the field. Move your cursor to guide the flow.</p>

<div style="display: flex; justify-content: center; margin-top: 24px;">
  <div style="border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08);">
    <canvas id="topo" width="900" height="500" style="display: block; cursor: crosshair;"></canvas>
  </div>
</div>

<p style="text-align: center; margin-top: 16px; font-size: 13px; opacity: 0.5;">Move your mouse — the contour field slowly shifts its flow toward your cursor</p>

<script>
(function() {
  const c = document.getElementById('topo');
  const ctx = c.getContext('2d');
  const cols = 100, rows = 55;
  const cw = c.width / cols, ch = c.height / rows;

  let mouseX = 0.5, mouseY = 0.5;
  // Smoothed direction influence — very gradual
  let flowDX = 0, flowDY = 0;
  let prevMX = 0.5, prevMY = 0.5;

  c.addEventListener('mousemove', (e) => {
    const rect = c.getBoundingClientRect();
    mouseX = (e.clientX - rect.left) / rect.width;
    mouseY = (e.clientY - rect.top) / rect.height;
  });

  let frame = 0;

  function draw() {
    ctx.fillStyle = '#09090b';
    ctx.fillRect(0, 0, c.width, c.height);

    // Accumulate mouse movement into a slow-changing flow direction
    const mdx = mouseX - prevMX;
    const mdy = mouseY - prevMY;
    prevMX = mouseX;
    prevMY = mouseY;

    // Very slow accumulation — mouse steers, doesn't jump
    flowDX += mdx * 0.3;
    flowDY += mdy * 0.3;
    // Gentle decay so it doesn't accumulate forever
    flowDX *= 0.998;
    flowDY *= 0.998;

    const fontSize = Math.min(cw, ch) * 0.72;
    ctx.font = `${fontSize}px "SF Mono", "Fira Code", "Cascadia Code", monospace`;
    ctx.textBaseline = 'middle';

    // Slow base time
    const t = frame * 0.003;

    // Flow offsets from accumulated mouse direction
    const fx = flowDX * 2.0;
    const fy = flowDY * 2.0;

    for (let r = 0; r < rows; r++) {
      for (let col = 0; col < cols; col++) {
        const x = col / cols;
        const y = r / rows;

        // Base topographic field with flow-shifted coordinates
        const sx = x + fx;
        const sy = y + fy;

        let v = Math.sin(sx * 5.0 + t * 1.2) * Math.cos(sy * 3.5 - t * 0.8) * 0.5
              + Math.sin((sx + sy) * 4.0 + t * 0.6) * 0.4
              + Math.sin(sx * 10 + sy * 6 + t * 1.5) * 0.15
              + Math.cos(sx * 7 - sy * 9 + t * 0.4) * 0.2;

        const normalized = (v + 2.0) / 4.0;

        // Contour detection
        const contourSpacing = 0.09;
        const modVal = normalized % contourSpacing;
        const distToLine = Math.abs(modVal - contourSpacing / 2);
        const isContour = distToLine < 0.012;
        const isNearContour = distToLine < 0.025;
        const isPeak = normalized > 0.72;

        if (isContour || isPeak) {
          const char = normalized > 0.5 ? '1' : '0';

          let hue, sat, light, alpha;

          if (isPeak && !isContour) {
            hue = 170 + normalized * 30;
            sat = 50;
            light = 25 + normalized * 20;
            alpha = normalized * 0.5;
          } else {
            hue = 165 + normalized * 50;
            sat = 55 + normalized * 25;
            light = 35 + normalized * 35;
            alpha = isContour ? (0.6 + normalized * 0.35) : 0.3;
          }

          ctx.fillStyle = `hsla(${hue}, ${sat}%, ${light}%, ${alpha})`;
          ctx.fillText(char, col * cw + cw * 0.15, r * ch + ch * 0.55);
        } else if (isNearContour) {
          const char = normalized > 0.5 ? '1' : '0';
          ctx.fillStyle = `hsla(180, 30%, 25%, 0.12)`;
          ctx.fillText(char, col * cw + cw * 0.15, r * ch + ch * 0.55);
        }
      }
    }

    frame++;
    requestAnimationFrame(draw);
  }

  draw();
})();
</script>
